services:
  firebird:
    build: .
    container_name: hcf_firebird
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: HERBARIUM.GDB
    volumes:
      - ./firebird/data:/firebird/data
      - ./firebird/backup:/backup
      - ./scripts:/scripts
      - ./BuildTabelas.sql:/home/herbario/BuildTabelas.sql 
    ports:
      - 3050:3050
    networks:
      - my_network

  mysql:
    image: mysql/mysql-server:latest
    container_name: hcf_mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: Test@123
      MYSQL_DATABASE: hcf
    ports:
      - 3306:3306
    volumes:
      - mysql-volume:/var/lib/mysql
    networks:
      - my_network

  postgres:
    image: postgres:15
    container_name: hcf_postgres
    restart: always
    environment:
      POSTGRES_DB: hcf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - my_network

volumes:
  mysql-volume:
    driver: local
  postgres-volume:
    driver: local

networks:
  my_network:
    driver: bridge
